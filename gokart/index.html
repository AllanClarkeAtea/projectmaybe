<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gokart Strategi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
html,body{min-height:100vh;background:#0D0D0D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
body{padding:0;margin:0}
.wrapper{max-width:680px;margin:0 auto;padding:0 1rem 3rem}

/* Header */
.hdr{padding:1.1rem 0 .5rem;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2A2A2A;margin-bottom:1rem}
.hdr-logo{font-size:22px;font-weight:800;color:#E8002D;letter-spacing:-.02em}
.hdr-logo span{color:#fff}
.hdr-sub{font-size:11px;color:#555;margin-top:1px}

:focus-visible{outline:3px solid #E8002D;outline-offset:2px;border-radius:4px}
.card{background:#161616;border:1px solid #2A2A2A;border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.85rem}
.sec{font-size:10px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.7rem}
.fl{font-size:11px;color:#C0C0C0;display:block;margin-bottom:3px}
input[type=number],input[type=text]{height:33px;padding:0 8px;font-size:13px;border:1px solid #2A2A2A;border-radius:6px;background:#1E1E1E;color:#fff;width:100%}
input:focus{outline:2px solid #E8002D;outline-offset:1px;border-color:#E8002D}
input.err{border:2px solid #E8002D;background:#1A0A0A}
select{height:33px;padding:0 8px;font-size:12px;border:1px solid #2A2A2A;border-radius:6px;background:#1E1E1E;color:#fff;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.row:last-child{margin-bottom:0}
.field{display:flex;flex-direction:column;flex:1;min-width:95px}

/* Mode buttons */
.mbtns{display:flex;gap:6px;flex-wrap:wrap}
.mb{flex:1;min-width:110px;padding:8px;border:1.5px solid #2A2A2A;border-radius:8px;background:#1E1E1E;color:#C0C0C0;font-size:12px;cursor:pointer;text-align:center;line-height:1.4;position:relative;transition:all .15s}
.mb[aria-pressed=true]{background:#1A0005;border-color:#E8002D;color:#FF6B6B;font-weight:700}
.mb[aria-pressed=true]::after{content:'✓';position:absolute;top:4px;right:6px;font-size:10px;color:#E8002D}
.mb .s{font-size:10px;color:#555;font-weight:400;display:block;margin-top:1px}

/* Boost settings */
.bbox{background:#111;border:1px solid #2A2A2A;border-radius:8px;padding:12px 14px;margin-top:9px}
.bflds{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.bfld{display:flex;flex-direction:column;gap:6px}
.bfld label{font-size:11px;color:#C0C0C0;font-weight:500;white-space:nowrap}
.binput-row{display:flex;align-items:center;gap:10px}
.binput-row input[type=number]{width:64px;height:38px;font-size:16px;font-weight:700;text-align:center;flex-shrink:0}
.binput-row .ul{font-size:13px;color:#C0C0C0;white-space:nowrap;font-weight:500}
.bfld .rh{font-size:10px;color:#555}

/* Driver count */
.dcs{display:flex;gap:6px;margin-bottom:16px}
.dcb{flex:1;height:44px;border:1.5px solid #2A2A2A;border-radius:8px;background:#1E1E1E;color:#555;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.dcb:hover:not(.on){background:#2A2A2A;color:#C0C0C0;border-color:#444}
.dcb.on{background:#E8002D;color:#fff;border-color:#E8002D;box-shadow:0 0 10px #E8002D44}
.dcb.on::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #E8002D}
.kpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kslot label{font-size:12px;color:#C0C0C0;display:flex;align-items:center;gap:6px;margin-bottom:5px}
.knr{width:70px;height:44px;text-align:center;font-size:20px;font-weight:700;border:1.5px solid #2A2A2A;border-radius:8px;background:#1E1E1E;color:#fff}
.kb{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font-weight:700;flex-shrink:0;border:1.5px solid}
.ka{background:#1A0005;color:#FF6B6B;border-color:#E8002D}
.kbg{background:#1A1000;color:#F5D98B;border-color:#C9A84C}
.dg{display:grid;grid-template-columns:1fr 105px;gap:7px;align-items:center;margin-bottom:5px}
.dg.hdr span{font-size:10px;color:#555;font-weight:700}

/* Buttons */
.gbtn{width:100%;padding:12px;background:#E8002D;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:3px;letter-spacing:.02em;transition:background .15s}
